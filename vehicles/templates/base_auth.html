<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoTrust{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #1b1e20;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .auth-card {
            background-color: #242729;
            border-radius: 15px;
            padding: 40px 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.15);
        }

        .auth-title {
            color: #dc3545;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            font-size: 2rem;
        }

        .form-control {
            background-color: #2e3133;
            border: none;
            color: white;
        }

        .form-control:focus {
            box-shadow: 0 0 5px #dc3545;
            border: none;
            background-color: #343739;
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-danger:hover {
            background-color: #b02a37;
        }

        .link-danger {
            color: #dc3545;
            text-decoration: none;
            font-weight: 600;
        }

        .link-danger:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 class="auth-title">{% block header %}{% endblock %}</h2>

        {% block content %}
        {% endblock %}
        
        <div class="footer-text">
            © 2025 AutoTrust - Todos los derechos reservados
        </div>
    </div>

</body>
</html>
